name: Build and Publish Bundles

on:
  push:
    branches: [main, master, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build All Bundles
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate HyUI Templates
        run: |
          echo "=== Validating HyUI Templates ==="
          python3 build-tools/hyui-validator/validate_hyuiml.py --module-scan --fail-on-error
      
      - name: Build All Frameworks
        run: |
          echo "=== Building Individual Frameworks ==="
          for repo in 01-platform-sdk 02-framework-accessor 02-framework-core 03-framework-storage 03-framework-config 03-framework-text-styling 02-adapter-hytale 02-adapter-mod-api 04-framework-condition 04-framework-objective 04-framework-npc 05-framework-quest 05-framework-ui; do
            echo "Building $repo..."
            cd "$repo" && mvn clean install -DskipTests -q && cd .. || exit 1
          done
      
      - name: Build Core Bundle (Mithril Forge)
        run: |
          echo "=== Building Mithril Forge - Core Library ==="
          cd bundle-core
          mvn clean package -DskipTests
          ls -lh target/argonath-core-bundle-*.jar
      
      - name: Build Quest Bundle (The Fellowship)
        run: |
          echo "=== Building The Fellowship - Quest System ==="
          cd bundle-quest
          mvn clean package -DskipTests
          ls -lh target/argonath-quest-bundle-*.jar
      
      - name: Build Mods
        run: |
          echo "=== Building Mods ==="
          for repo in 06-*; do
            if [ -d "$repo" ]; then
              echo "Building $repo..."
              cd "$repo" && mvn clean package -DskipTests && cd .. || exit 1
            fi
          done
      
      - name: Upload Core Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mithril-forge-core-${{ github.sha }}
          path: bundle-core/target/argonath-core-bundle-*.jar
          retention-days: 30
      
      - name: Upload Quest Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-fellowship-quest-${{ github.sha }}
          path: bundle-quest/target/argonath-quest-bundle-*.jar
          retention-days: 30
      
      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mods-${{ github.sha }}
          path: |
            06-*/target/*.jar
            !06-*/target/*-sources.jar
            !06-*/target/*-javadoc.jar
          retention-days: 30
      
      - name: Generate Build Report
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundles" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle | Size | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|---------|" >> $GITHUB_STEP_SUMMARY
          
          CORE_JAR=$(ls bundle-core/target/argonath-core-bundle-*.jar 2>/dev/null | head -n1)
          CORE_SIZE=$(du -h "$CORE_JAR" 2>/dev/null | cut -f1)
          CORE_VERSION=$(basename "$CORE_JAR" | sed 's/argonath-core-bundle-//' | sed 's/.jar//')
          echo "| Mithril Forge - Core | $CORE_SIZE | $CORE_VERSION |" >> $GITHUB_STEP_SUMMARY
          
          QUEST_JAR=$(ls bundle-quest/target/argonath-quest-bundle-*.jar 2>/dev/null | head -n1)
          QUEST_SIZE=$(du -h "$QUEST_JAR" 2>/dev/null | cut -f1)
          QUEST_VERSION=$(basename "$QUEST_JAR" | sed 's/argonath-quest-bundle-//' | sed 's/.jar//')
          echo "| The Fellowship - Quest | $QUEST_SIZE | $QUEST_VERSION |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mods" >> $GITHUB_STEP_SUMMARY
          for mod in 06-*/target/*.jar; do
            if [[ ! "$mod" =~ (sources|javadoc) ]]; then
              MOD_NAME=$(basename "$mod")
              MOD_SIZE=$(du -h "$mod" 2>/dev/null | cut -f1)
              echo "- $MOD_NAME ($MOD_SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done

  publish-curseforge:
    name: Publish to CurseForge
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests toml
      
      - name: Download Core Bundle
        uses: actions/download-artifact@v4
        with:
          name: mithril-forge-core-${{ github.sha }}
          path: bundle-core/target/
      
      - name: Download Quest Bundle
        uses: actions/download-artifact@v4
        with:
          name: the-fellowship-quest-${{ github.sha }}
          path: bundle-quest/target/
      
      - name: Download Mod Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mods-${{ github.sha }}
          path: ./
      
      - name: Publish Mithril Forge to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python scripts/publish-curseforge.py --repo bundle-core
      
      - name: Publish The Fellowship to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python scripts/publish-curseforge.py --repo bundle-quest
      
      - name: Publish Mods to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          for repo in 06-*; do
            if [ -f "${repo}/curseforge.toml" ]; then
              echo "Publishing ${repo}..."
              python scripts/publish-curseforge.py --repo "${repo}"
            fi
          done
      
      - name: Create Release Summary
        run: |
          echo "## 🚀 Published to CurseForge" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundles" >> $GITHUB_STEP_SUMMARY
          echo "- [Mithril Forge - Core Library](https://www.curseforge.com/hytale/mods/mithril-forge-core)" >> $GITHUB_STEP_SUMMARY
          echo "- [The Fellowship - Quest System](https://www.curseforge.com/hytale/mods/the-fellowship-quest)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mods" >> $GITHUB_STEP_SUMMARY
          echo "- [Frodo's Journal - Quest Tracker](https://www.curseforge.com/hytale/mods/frodos-journal)" >> $GITHUB_STEP_SUMMARY

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Run Framework Tests
        run: |
          for repo in 02-* 03-* 04-* 05-*; do
            if [ -d "$repo" ]; then
              echo "Testing $repo..."
              cd "$repo" && mvn test && cd .. || exit 1
            fi
          done
      
      - name: Generate Test Report
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed. Check job logs for details." >> $GITHUB_STEP_SUMMARY
